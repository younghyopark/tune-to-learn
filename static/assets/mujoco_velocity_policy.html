<!--
  MuJoCo Policy Playback Viewer

  Runs a trained ONNX policy in the browser via MuJoCo WASM + onnxruntime-web.

  Parameters:
    scene  – path to MuJoCo XML (required)
    policy – path to ONNX policy file (required)
    config – path to policy_config.json (required)
    bg     – background hex color without # (default: f0f2f5)

  Keyboard controls:
    W/S    – forward/backward velocity
    A/D    – left/right velocity
    Q/E    – turn left/right
    Space  – stop (zero command)
    R      – reset simulation

  When idle (no keys pressed), a random velocity command is sampled
  automatically so the robot walks on its own.

  Example:
    mujoco_policy.html?scene=g1_scene.xml&policy=policy.onnx&config=policy_config.json
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuJoCo Policy Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f0f2f5; }
  #container { width: 100%; height: 100%; position: relative; }
  canvas { display: block; width: 100%; height: 100%; }

  #loading-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(240,242,245,0.8);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    color: #555;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    z-index: 100; transition: opacity 0.5s;
  }
  #loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(0,0,0,0.08);
    border-top-color: #7c8cf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-status { font-size: 13px; opacity: 0.6; }

  /* Command widget (bottom-right) */
  #cmd-widget {
    position: absolute; bottom: 50px; right: 12px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 10px;
    z-index: 10; padding: 10px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    user-select: none; width: 220px;
  }
  .cmd-top { display: flex; gap: 10px; align-items: center; }
  #xy-pad { width: 80px; height: 80px; flex-shrink: 0; }
  .cmd-vals {
    font-size: 11px; color: #888;
    font-family: 'SF Mono', 'Fira Code', monospace; line-height: 2.0;
  }
  .cmd-vals .v { color: #333; font-weight: 600; }
  #wz-bar { width: 100%; height: 20px; display: block; margin-top: 6px; }
  .cmd-keys {
    display: flex; gap: 8px; align-items: center;
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid rgba(0,0,0,0.06);
  }
  .keys-grid { display: flex; flex-direction: column; gap: 2px; }
  .key-row { display: flex; gap: 2px; }
  .key-row.indent { margin-left: 11px; }
  .kc {
    width: 20px; height: 20px;
    border: 1px solid rgba(0,0,0,0.12); border-radius: 3px;
    background: rgba(0,0,0,0.03);
    font-size: 9px; font-weight: 600; color: #aaa;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.08s;
  }
  .kc.on { background: #4a7aec; color: #fff; border-color: #4a7aec; }
  .mode-badge {
    font-size: 9px; font-weight: 600; letter-spacing: 0.5px;
    padding: 2px 6px; border-radius: 3px; margin-left: auto;
  }
  .mode-badge.auto { background: rgba(124,168,248,0.15); color: #5a8df8; }
  .mode-badge.manual { background: rgba(248,200,124,0.15); color: #d4a030; }

  /* Mode toggle (top-center) */
  #mode-toggle {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 30;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 8px; overflow: hidden;
    border: 1px solid rgba(0,0,0,0.08);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px; user-select: none;
  }
  #mode-toggle button {
    background: none; border: none; padding: 6px 16px;
    cursor: pointer; font-size: 12px; font-weight: 500;
    color: #888; transition: all 0.15s;
  }
  #mode-toggle button.active { background: #4a7aec; color: #fff; }
  #mode-toggle button:not(.active):hover { background: rgba(0,0,0,0.04); }

  /* Gain test info panel */
  #gain-info {
    position: absolute; bottom: 50px; right: 12px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border-radius: 10px; z-index: 10;
    padding: 12px 16px; width: 220px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px; color: #555;
  }
  #gain-info h5 {
    margin: 0 0 6px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; color: #888; font-weight: 600;
  }
  #gain-info p { margin: 0 0 4px; line-height: 1.4; }
  #gain-info .exc-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px;
    color: #888; font-weight: 600; margin: 8px 0 4px;
  }
  .exc-row { display: flex; gap: 4px; }
  .exc-row button {
    flex: 1; padding: 5px 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 10px; border: 1px solid rgba(0,0,0,0.1); border-radius: 4px;
    background: transparent; color: #888; cursor: pointer; transition: all 0.12s;
  }
  .exc-row button:hover { border-color: rgba(0,0,0,0.2); }
  .exc-row button.active { background: #4a7aec; color: #fff; border-color: transparent; }

  #hint-overlay { display: none; }
  #legend { display: none; }

  /* Reset button (bottom-right, below cmd-widget) */
  #controls {
    position: absolute; bottom: 12px; right: 12px;
    display: flex; gap: 6px; z-index: 10;
  }
  #play-btn { display: none; }
  .ctrl-btn {
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #555; border: 1px solid rgba(0,0,0,0.08);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px; padding: 6px 12px; border-radius: 6px;
    cursor: pointer;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.9); }

  /* Live physics badge (bottom-left) */
  #live-badge {
    position: absolute; bottom: 12px; left: 12px;
    z-index: 20;
    display: flex; align-items: center; gap: 6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: #333;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 5px 10px 5px 8px;
    border-radius: 4px;
    pointer-events: none; user-select: none;
  }
  #live-badge .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff3b30;
    box-shadow: 0 0 6px 2px rgba(255,59,48,0.6);
    animation: live-pulse 1.2s ease-in-out infinite;
  }
  #live-badge .live-hint {
    font-weight: 400; font-size: 10px;
    text-transform: none; letter-spacing: 0;
    color: #666; margin-left: 4px;
  }
  @keyframes live-pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px 2px rgba(255,59,48,0.6); }
    50%      { opacity: 0.7; box-shadow: 0 0 10px 4px rgba(255,59,48,0.3); }
  }

  #help-btn {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    border: 1px solid rgba(0,0,0,0.12);
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 14px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #555;
    padding: 5px 14px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  #help-btn:hover { background: rgba(255,255,255,0.95); color: #222; }

  #help-popup {
    display: none;
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 200;
    background: #fff;
    border-radius: 10px;
    padding: 14px 18px;
    width: 260px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.2);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    color: #333;
  }
  #help-popup.show { display: block; }
  #help-popup h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  #help-popup ul { margin: 0; padding-left: 16px; }
  #help-popup li { margin-bottom: 2px; }
  #help-popup .help-close {
    position: absolute; top: 6px; right: 10px;
    background: none; border: none; font-size: 16px;
    cursor: pointer; color: #999; line-height: 1;
  }

  /* Joint response plot (transparent, like trajectory viewer) */
  #response-float {
    position: absolute; top: 10px; right: 10px;
    z-index: 20; width: 220px;
    background: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11px; color: #444;
    padding: 8px; user-select: none;
  }
  #response-float .rf-title {
    font-weight: 600; font-size: 10px; letter-spacing: 0.3px;
    text-transform: uppercase; color: #888; margin-bottom: 4px;
  }
  #response-canvas {
    width: 100%; height: 150px; display: block; border-radius: 4px;
  }
  .joint-sel-row {
    display: flex; gap: 2px; justify-content: center; margin-top: 4px;
  }
  .joint-btn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 9px; padding: 2px 4px; min-width: 20px; height: 18px;
    border: 1px solid rgba(0,0,0,0.12); border-radius: 3px;
    cursor: pointer; background: transparent; color: #888;
    display: flex; align-items: center; justify-content: center;
  }
  .joint-btn:hover { border-color: rgba(0,0,0,0.2); }
  .joint-btn.active { border-color: transparent; color: #fff; }

  /* ── Onboarding Tour ─────────────────────────────── */
  #tour-spotlight {
    position: fixed;
    z-index: 180;
    border-radius: 8px;
    pointer-events: none;
    transition: top 0.3s ease, left 0.3s ease, width 0.3s ease, height 0.3s ease, opacity 0.3s ease;
  }
  #tour-spotlight.hidden { opacity: 0; pointer-events: none; }
  #tour-spotlight::after {
    content: '';
    position: absolute;
    inset: -4px;
    border: 3px solid rgba(108, 123, 240, 0.8);
    border-radius: 10px;
    box-shadow: 0 0 12px 4px rgba(108, 123, 240, 0.4);
    pointer-events: none;
  }
  .tour-target-elevated { z-index: 185 !important; }

  #tour-tooltip {
    position: fixed;
    z-index: 200;
    background: #fff;
    border-radius: 10px;
    padding: 16px 18px 14px;
    width: 280px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
    transition: opacity 0.25s, transform 0.25s, top 0.3s ease, left 0.3s ease;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  #tour-tooltip.hidden { opacity: 0; pointer-events: none; transform: translateY(8px); }
  #tour-tooltip.tour-intro {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  #tour-tooltip::before {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    background: #fff;
    transform: rotate(45deg);
  }
  #tour-tooltip[data-arrow="none"]::before { display: none; }

  .tour-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tour-step-num {
    width: 24px; height: 24px;
    background: #6c7bf0; color: #fff;
    border-radius: 50%; font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .tour-title { font-size: 14px; font-weight: 600; color: #222; }
  .tour-desc { font-size: 12px; line-height: 1.55; color: #555; margin-bottom: 14px; }
  .tour-footer { display: flex; align-items: center; justify-content: space-between; }
  .tour-progress { font-size: 11px; color: #999; }
  .tour-btns { display: flex; gap: 8px; }
  .tour-btn {
    padding: 6px 14px; border-radius: 6px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: background 0.12s, transform 0.08s; border: none;
  }
  .tour-btn:active { transform: scale(0.96); }
  .tour-btn-skip { background: transparent; color: #888; }
  .tour-btn-skip:hover { background: rgba(0,0,0,0.05); color: #666; }
  .tour-btn-next { background: #6c7bf0; color: #fff; }
  .tour-btn-next:hover { background: #8290ff; }
  .tour-btn-next:disabled { background: #b0b8f8; cursor: not-allowed; opacity: 0.6; }
</style>
</head>
<body>

<div id="container">
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-status">Loading…</div>
  </div>

  <!-- Live physics badge (bottom-left) -->
  <div id="live-badge" style="display:none">
    <span class="live-dot"></span>
    <span>Live Physics</span>
    <span class="live-hint">— WASD·QE to steer</span>
  </div>
  <button id="help-btn" title="Replay tutorial" style="display:none">? Tour</button>

  <!-- Mode toggle (top-center) -->
  <div id="mode-toggle" style="display:none">
    <button id="mode-walk" class="active">Walk</button>
    <button id="mode-gain">Gain Test</button>
  </div>

  <!-- Gain test info panel (replaces cmd-widget) -->
  <div id="gain-info" style="display:none">
    <h5>Gain Test</h5>
    <p>Torso fixed. Drag the robot to feel stiffness.</p>
    <div class="exc-label">Excitation</div>
    <div class="exc-row">
      <button class="active" data-exc="hold">Hold</button>
      <button data-exc="sine">Sine</button>
      <button data-exc="step">Step</button>
    </div>
    <p style="color:#888;font-size:10px;margin-top:6px">Press <b>R</b> to reset.</p>
  </div>

  <!-- Command widget (bottom-right) -->
  <div id="cmd-widget" style="display:none">
    <div class="cmd-top">
      <canvas id="xy-pad"></canvas>
      <div class="cmd-vals">
        <div>vx <span class="v" id="cmd-vx">0.00</span> m/s</div>
        <div>vy <span class="v" id="cmd-vy">0.00</span> m/s</div>
        <div>wz <span class="v" id="cmd-wz">0.00</span> rad/s</div>
      </div>
    </div>
    <canvas id="wz-bar"></canvas>
    <div class="cmd-keys">
      <div class="keys-grid">
        <div class="key-row">
          <div class="kc" data-k="KeyQ">Q</div>
          <div class="kc" data-k="KeyW">W</div>
          <div class="kc" data-k="KeyE">E</div>
        </div>
        <div class="key-row indent">
          <div class="kc" data-k="KeyA">A</div>
          <div class="kc" data-k="KeyS">S</div>
          <div class="kc" data-k="KeyD">D</div>
        </div>
      </div>
      <span class="mode-badge auto" id="mode-text">AUTO</span>
    </div>
  </div>

  <!-- Joint response plot (top-right) -->
  <div id="response-float" style="display:none">
    <div class="rf-title">JOINT RESPONSE</div>
    <canvas id="response-canvas"></canvas>
    <div class="joint-sel-row" id="joint-selector"></div>
  </div>

  <div id="legend" style="display:none">
    <div><span class="legend-dot" style="background:#3344aa"></span>Cmd vel</div>
    <div><span class="legend-dot" style="background:#00aaff"></span>Actual vel</div>
    <div><span class="legend-dot" style="background:#33aa33"></span>Cmd yaw</div>
    <div><span class="legend-dot" style="background:#00ff66"></span>Actual yaw</div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="play-btn">▶ Play</button>
    <button class="ctrl-btn" id="reset-btn">↻ Reset</button>
  </div>

  <div id="hint-overlay">Right-click: orbit · Scroll: zoom</div>
</div>

<!-- ── Tour spotlight & tooltip (outside container for full coverage) ── -->
<div id="tour-spotlight" class="hidden"></div>
<div id="tour-tooltip" class="hidden" data-arrow="none">
  <div class="tour-header">
    <span class="tour-step-num" id="tour-step-num">1</span>
    <span class="tour-title" id="tour-title">Title</span>
  </div>
  <div class="tour-desc" id="tour-desc">Description</div>
  <div class="tour-footer">
    <span class="tour-progress" id="tour-progress">1 of 5</span>
    <div class="tour-btns">
      <button class="tour-btn tour-btn-skip" id="tour-skip">Skip</button>
      <button class="tour-btn tour-btn-next" id="tour-next">Next</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.mjs"
  }
}
</script>

<script type="module">
import { MuJoCoViewer } from './js_velocity/mujoco_viewer.js';
import { PolicyRunner } from './js_velocity/policy_runner.js';

// ── Parse URL params ──────────────────────────────────
const params = new URLSearchParams(window.location.search);
const scenePath = params.get('scene');
const policyPath = params.get('policy');
const configPath = params.get('config');

const statusEl = document.getElementById('loading-status');

if (!scenePath || !policyPath || !configPath) {
  statusEl.textContent =
    'Missing parameters. Usage: ?scene=g1_scene.xml&policy=policy.onnx&config=policy_config.json';
  throw new Error('Missing required URL parameters');
}

const bgColor = '#' + (params.get('bg') || 'f0f2f5');
let curveColor = params.get('gainColor') || '#e6194b';

// ── Load config ───────────────────────────────────────
statusEl.textContent = 'Loading config...';
const configResponse = await fetch(configPath);
let config = await configResponse.json();

// ── Create viewer ─────────────────────────────────────
const overlayEl = document.getElementById('loading-overlay');

const viewer = new MuJoCoViewer(document.getElementById('container'), {
  sceneXML: scenePath,
  wasmURL: params.get('wasm') || '../dist/mujoco_wasm.js',
  background: bgColor,
  cameraPos: [2.5, -1.5, 1.0],
  cameraTarget: [0, 0, 0.5],
  onStatus: (msg) => { statusEl.textContent = msg; },
  onReady: () => {},
});

try {
  await viewer.init();
} catch (err) {
  console.error('Viewer init failed:', err);
  statusEl.textContent = 'Failed to load viewer: ' + err.message;
  throw err;
}

// Enable camera tracking.
viewer.enableCameraTracking();

// ── Create policy runner ──────────────────────────────
statusEl.textContent = 'Loading ONNX policy...';
const runner = new PolicyRunner(viewer, config);

try {
  await runner.init(policyPath);
} catch (err) {
  console.error('Policy init failed:', err);
  statusEl.textContent = 'Failed to load policy: ' + err.message;
  throw err;
}

// Initialize velocity arrow visualizations.
runner.initArrows();

// Create a fixed-base model for gain test mode (no freejoint → no coupling).
let fixedModel = null, fixedData = null;
let originalModel = null, originalData = null;
try {
  const mj = viewer.getMujoco();
  const xmlText = new TextDecoder().decode(mj.FS.readFile('/working/scene.xml'));
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');

  // Remove floor plane so feet hang freely.
  doc.querySelectorAll('worldbody > geom[type="plane"]').forEach(g => g.remove());

  // Remove the freejoint and raise the root body.
  const fj = doc.querySelector('joint[type="free"]');
  if (fj) {
    const body = fj.parentElement;
    const pos = body.getAttribute('pos');
    if (pos) {
      const p = pos.split(/\s+/);
      p[2] = String(parseFloat(p[2]) + 0.3);
      body.setAttribute('pos', p.join(' '));
    }
    fj.remove();
  }

  // Fix keyframe: strip 7 base DOFs from qpos.
  const keyEl = doc.querySelector('key');
  if (keyEl && keyEl.getAttribute('qpos')) {
    const v = keyEl.getAttribute('qpos').trim().split(/\s+/);
    v.splice(0, 7);
    keyEl.setAttribute('qpos', v.join(' '));
  }

  const fixedXml = new XMLSerializer().serializeToString(doc);
  mj.FS.writeFile('/working/fixed_scene.xml', fixedXml);
  fixedModel = mj.MjModel.loadFromXML('/working/fixed_scene.xml');
  fixedData = new mj.MjData(fixedModel);
  mj.mj_resetDataKeyframe(fixedModel, fixedData, 0);
  mj.mj_forward(fixedModel, fixedData);
} catch (err) {
  console.warn('Fixed model creation failed (gain test disabled):', err);
}

overlayEl.classList.add('hidden');
document.getElementById('cmd-widget').style.display = 'block';
document.getElementById('live-badge').style.display = 'flex';
document.getElementById('help-btn').style.display = 'block';
document.getElementById('response-float').style.display = 'block';
document.getElementById('controls').style.display = 'flex';
document.getElementById('mode-toggle').style.display = 'flex';

// Signal parent that we're ready for hot-swap messages.
window.parent.postMessage({ type: 'sim-ready' }, '*');

// Help button → replay tour
document.getElementById('help-btn').addEventListener('click', () => {
  localStorage.removeItem(TOUR_KEY);
  startTour();
});

// ── Joint response plot ──────────────────────────────
const RESP_HISTORY = 60;
const responseHistory = [];
const respCanvas = document.getElementById('response-canvas');
const jointSelRow = document.getElementById('joint-selector');

// Show a curated subset of joints for legibility.
const JOINT_SUBSET = [
  { idx: 0, label: 'LHip' },
  { idx: 3, label: 'LKnee' },
  { idx: 4, label: 'LAnk' },
  { idx: 6, label: 'RHip' },
  { idx: 9, label: 'RKnee' },
  { idx: 10, label: 'RAnk' },
  { idx: 12, label: 'Waist' },
];
let selectedSubIdx = 4; // index into JOINT_SUBSET (default: RKnee)

// Build joint selector buttons dynamically.
JOINT_SUBSET.forEach((j, si) => {
  const btn = document.createElement('button');
  btn.className = 'joint-btn' + (si === selectedSubIdx ? ' active' : '');
  btn.textContent = j.label;
  btn.dataset.si = si;
  if (si === selectedSubIdx) btn.style.background = curveColor;
  btn.addEventListener('click', () => {
    selectedSubIdx = si;
    jointSelRow.querySelectorAll('.joint-btn').forEach(b => {
      b.classList.remove('active'); b.style.background = '';
    });
    btn.classList.add('active');
    btn.style.background = curveColor;
  });
  jointSelRow.appendChild(btn);
});

let respSkip = 0;

runner.onStep = (data, actionData) => {
  respSkip++;
  if (respSkip < 3) return;
  respSkip = 0;
  const cfg = config;
  const qOff = cfg.qpos_joint_offset;
  const actual = [], target = [];
  for (const j of JOINT_SUBSET) {
    actual.push(data.qpos[qOff + j.idx]);
    target.push(
      actionData[j.idx] * cfg.action_scale[j.idx] + cfg.default_joint_pos[j.idx]
    );
  }
  responseHistory.push({ actual, target });
  if (responseHistory.length > RESP_HISTORY) responseHistory.shift();
};

function drawResponsePlot() {
  if (!respCanvas) return;
  const dpr = Math.min(window.devicePixelRatio, 2);
  const W = respCanvas.clientWidth;
  const H = respCanvas.clientHeight;
  if (W === 0 || H === 0) return;
  respCanvas.width = W * dpr;
  respCanvas.height = H * dpr;
  const ctx = respCanvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const si = selectedSubIdx;
  const color = curveColor;
  const n = responseHistory.length;
  const padL = 38, padR = 6, padT = 20, padB = 8;
  const pW = W - padL - padR;
  const pH = H - padT - padB;

  ctx.clearRect(0, 0, W, H);

  if (n < 2) {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.font = '13px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Waiting for data…', W / 2, H / 2);
    return;
  }

  // Y range
  let yMin = Infinity, yMax = -Infinity;
  for (const s of responseHistory) {
    yMin = Math.min(yMin, s.actual[si], s.target[si]);
    yMax = Math.max(yMax, s.actual[si], s.target[si]);
  }
  if (yMax - yMin < 0.3) {
    const mid = (yMin + yMax) / 2;
    yMin = mid - 0.15; yMax = mid + 0.15;
  }
  const yPad = (yMax - yMin) * 0.08;
  yMin -= yPad; yMax += yPad;

  function xOf(i) { return padL + (i / (RESP_HISTORY - 1)) * pW; }
  function yOf(v) { return padT + (1 - (v - yMin) / (yMax - yMin)) * pH; }
  const startIdx = RESP_HISTORY - n;

  // Y-axis ticks
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.font = '11px -apple-system, BlinkMacSystemFont, sans-serif';
  for (let t = 0; t <= 3; t++) {
    const v = yMin + (t / 3) * (yMax - yMin);
    const y = padT + (1 - t / 3) * pH;
    ctx.fillText(v.toFixed(2), padL - 4, y + 4);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 0.5;
    ctx.moveTo(padL, y); ctx.lineTo(padL + pW, y);
    ctx.stroke();
  }

  // Target — dashed
  ctx.beginPath();
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < n; i++) {
    const x = xOf(startIdx + i), y = yOf(responseHistory[i].target[si]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Actual — solid
  ctx.beginPath();
  ctx.setLineDash([]);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  for (let i = 0; i < n; i++) {
    const x = xOf(startIdx + i), y = yOf(responseHistory[i].actual[si]);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Legend
  ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = color;
  ctx.fillText('— actual', W - padR - 70, 15);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillText('- - target', W - padR, 15);
}

// Redraw at display refresh rate (stoppable for hibernation).
let _respRunning = true;
function respLoop() {
  if (!_respRunning) return;
  drawResponsePlot();
  requestAnimationFrame(respLoop);
}
respLoop();

// ── Gain test mode state ─────────────────────────────
let gainTestActive = false;
let _gainTestAnimId = null;
let _savedCamPos = null;
let _savedCamTarget = null;
let gainExcMode = 'hold';        // 'hold' | 'sine' | 'step'
let gainTestSimTime = 0;
const GAIN_EXC_AMP = 0.15;      // radians
const GAIN_EXC_SINE_HZ = 0.5;
const GAIN_EXC_STEP_PERIOD = 2.0; // seconds per half-cycle

// ── Auto-command state ───────────────────────────────
let autoCommandMode = true;
const AUTO_TARGET = [1.0, 0, 0.7]; // 1 m/s forward + 0.7 rad/s turn
let lastUserInputTime = 0;
const AUTO_IDLE_MS = 2000;

const CMD_STEP = { vx: 0.3, vy: 0.2, wz: 0.15 };
const CMD_MAX = { vx: 2.0, vy: 1.0, wz: 0.7 };
const keysDown = new Set();
const modeTextEl = document.getElementById('mode-text');

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ── Joystick canvas drawing ─────────────────────────
function drawXYPad() {
  const canvas = document.getElementById('xy-pad');
  const dpr = Math.min(window.devicePixelRatio, 2);
  const W = canvas.clientWidth;
  if (W === 0) return;
  canvas.width = canvas.height = W * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const cx = W / 2, cy = W / 2, r = W / 2 - 2;

  // Background circle
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.08)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Crosshairs
  ctx.beginPath();
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 0.5;
  ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy);
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r);
  ctx.stroke();

  // 50% range ring
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.04)';
  ctx.stroke();

  // Command dot: vx → up, vy → right
  const cmd = runner.command;
  const dotX = cx + (cmd[1] / CMD_MAX.vx) * r;
  const dotY = cy - (cmd[0] / CMD_MAX.vx) * r;

  // Glow
  ctx.beginPath();
  ctx.arc(dotX, dotY, 6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(74,122,236,0.2)';
  ctx.fill();
  // Dot
  ctx.beginPath();
  ctx.arc(dotX, dotY, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#4a7aec';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawWZBar() {
  const canvas = document.getElementById('wz-bar');
  const dpr = Math.min(window.devicePixelRatio, 2);
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  if (W === 0) return;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const padX = 6, trackW = W - padX * 2;
  const trackY = H / 2, trackH = 3;
  const centerX = padX + trackW / 2;

  // Track
  ctx.fillStyle = 'rgba(0,0,0,0.06)';
  ctx.fillRect(padX, trackY - trackH / 2, trackW, trackH);

  // Center tick
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(centerX - 0.5, trackY - 5, 1, 10);

  // Dot: positive wz = turn left → dot left
  const frac = clamp(runner.command[2] / CMD_MAX.wz, -1, 1);
  const dotX = centerX - frac * (trackW / 2);

  ctx.beginPath();
  ctx.arc(dotX, trackY, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#33aa33';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

// ── Command update loop (30 Hz) ─────────────────────
function updateCommand() {
  const now = Date.now();
  const cmd = runner.command;

  // Switch to auto after idle.
  if (!autoCommandMode && keysDown.size === 0 && now - lastUserInputTime > AUTO_IDLE_MS) {
    autoCommandMode = true;
    modeTextEl.textContent = 'AUTO';
    modeTextEl.className = 'mode-badge auto';
  }

  if (autoCommandMode) {
    const alpha = 0.03;
    cmd[0] += (AUTO_TARGET[0] - cmd[0]) * alpha;
    cmd[1] += (AUTO_TARGET[1] - cmd[1]) * alpha;
    cmd[2] += (AUTO_TARGET[2] - cmd[2]) * alpha;
  } else {
    let vx = 0, vy = 0, wz = 0;
    if (keysDown.has('KeyW') || keysDown.has('ArrowUp'))    vx += CMD_STEP.vx;
    if (keysDown.has('KeyS') || keysDown.has('ArrowDown'))  vx -= CMD_STEP.vx;
    if (keysDown.has('KeyA') || keysDown.has('ArrowLeft'))  vy += CMD_STEP.vy;
    if (keysDown.has('KeyD') || keysDown.has('ArrowRight')) vy -= CMD_STEP.vy;
    if (keysDown.has('KeyQ')) wz += CMD_STEP.wz;
    if (keysDown.has('KeyE')) wz -= CMD_STEP.wz;
    const decay = 0.92;
    cmd[0] = clamp(cmd[0] * decay + vx, -CMD_MAX.vx, CMD_MAX.vx);
    cmd[1] = clamp(cmd[1] * decay + vy, -CMD_MAX.vy, CMD_MAX.vy);
    cmd[2] = clamp(cmd[2] * decay + wz, -CMD_MAX.wz, CMD_MAX.wz);
  }

  // Numeric display
  document.getElementById('cmd-vx').textContent = cmd[0].toFixed(2);
  document.getElementById('cmd-vy').textContent = cmd[1].toFixed(2);
  document.getElementById('cmd-wz').textContent = cmd[2].toFixed(2);

  // Key highlights
  document.querySelectorAll('.kc').forEach(el => {
    el.classList.toggle('on', keysDown.has(el.dataset.k));
  });

  // Redraw joystick canvases
  drawXYPad();
  drawWZBar();
}

let _cmdIntervalId = setInterval(updateCommand, 33);

// ── Keyboard controls ────────────────────────────────
function setManualMode() {
  autoCommandMode = false;
  lastUserInputTime = Date.now();
  modeTextEl.textContent = 'MANUAL';
  modeTextEl.className = 'mode-badge manual';
}
function setAutoMode() {
  autoCommandMode = true;
  modeTextEl.textContent = 'AUTO';
  modeTextEl.className = 'mode-badge auto';
}

window.addEventListener('keydown', (e) => {
  if (gainTestActive) {
    if (e.code === 'KeyR') resetGainTest();
    return;
  }
  if (e.code === 'Space') {
    e.preventDefault();
    runner.command.fill(0);
    setManualMode();
    return;
  }
  if (e.code === 'KeyR') {
    runner.reset();
    setAutoMode();
    return;
  }
  keysDown.add(e.code);
  setManualMode();
});

window.addEventListener('keyup', (e) => {
  keysDown.delete(e.code);
  // Reset idle timer so auto-mode waits another full interval after key release
  if (!autoCommandMode) lastUserInputTime = Date.now();
});

// ── Button controls (hidden but kept for compatibility) ──
const playBtn = document.getElementById('play-btn');
let isPlaying = false;

if (playBtn) {
  playBtn.addEventListener('click', () => {
    if (isPlaying) {
      runner.stop();
      playBtn.textContent = '▶ Play';
    } else {
      runner.start();
      playBtn.textContent = '⏸ Pause';
    }
    isPlaying = !isPlaying;
  });
}

const resetBtn = document.getElementById('reset-btn');
if (resetBtn) {
  resetBtn.addEventListener('click', () => {
    if (gainTestActive) { resetGainTest(); return; }
    runner.reset();
    setAutoMode();
  });
}

// ── Pause/resume from parent (iframe hibernation) ────
let _simPaused = false;
window.addEventListener('message', (e) => {
  if (e.data?.type === 'sim-pause' && !_simPaused) {
    _simPaused = true;
    if (gainTestActive) {
      if (_gainTestAnimId !== null) {
        cancelAnimationFrame(_gainTestAnimId);
        _gainTestAnimId = null;
      }
    } else {
      if (isPlaying) runner.stop();
    }
    viewer.stopRenderLoop();
    _respRunning = false;
    clearInterval(_cmdIntervalId);
    _cmdIntervalId = null;
  }
  if (e.data?.type === 'sim-resume' && _simPaused) {
    _simPaused = false;
    if (gainTestActive) {
      _gainTestAnimId = requestAnimationFrame(gainTestStep);
    } else {
      if (isPlaying) runner.start();
      else viewer.startRenderLoop();
    }
    _respRunning = true;
    respLoop();
    _cmdIntervalId = setInterval(updateCommand, 33);
  }
  if (e.data?.type === 'swap-config') {
    console.log('[velocity-viewer] received swap-config', e.data);
    swapConfig(e.data.scene, e.data.policy, e.data.config, e.data.gainColor);
  }
});

// ── Gain test mode functions ─────────────────────────

function enterGainTestMode() {
  if (gainTestActive || !fixedModel) return;
  gainTestActive = true;

  // Stop policy runner.
  if (isPlaying) {
    runner.stop();
    viewer.stopRenderLoop();
  }

  // Hide velocity arrows.
  if (runner._arrows) {
    for (const a of Object.values(runner._arrows)) a.visible = false;
  }

  // Swap to fixed-base model (no freejoint → no leg coupling).
  originalModel = viewer.model;
  originalData = viewer.data;
  viewer.model = fixedModel;
  viewer.data = fixedData;

  // Save current camera pose and set gain-test view.
  viewer.disableCameraTracking();
  _savedCamPos = viewer.camera.position.clone();
  _savedCamTarget = viewer.controls.target.clone();
  viewer.camera.position.set(1.9505, 1.3010, 1.1637);
  viewer.controls.target.set(0.0977, 0.9305, 0.0520);

  // Switch UI.
  document.getElementById('cmd-widget').style.display = 'none';
  document.getElementById('gain-info').style.display = 'block';
  document.querySelector('#live-badge span:nth-child(2)').textContent = 'Gain Test';
  document.querySelector('#live-badge .live-hint').textContent = '— drag to perturb';

  responseHistory.length = 0;
  gainExcMode = 'hold';
  gainTestSimTime = 0;
  document.querySelectorAll('.exc-row button').forEach(b => {
    b.classList.toggle('active', b.dataset.exc === 'hold');
  });
  resetGainTest();
  _gainTestAnimId = requestAnimationFrame(gainTestStep);
}

function exitGainTestMode() {
  if (!gainTestActive) return;
  gainTestActive = false;

  if (_gainTestAnimId !== null) {
    cancelAnimationFrame(_gainTestAnimId);
    _gainTestAnimId = null;
  }

  if (runner._arrows) {
    for (const a of Object.values(runner._arrows)) a.visible = true;
  }

  // Swap back to original free-joint model.
  viewer.model = originalModel;
  viewer.data = originalData;
  originalModel = null;
  originalData = null;

  // Restore saved camera pose and re-enable tracking.
  if (_savedCamPos) viewer.camera.position.copy(_savedCamPos);
  if (_savedCamTarget) viewer.controls.target.copy(_savedCamTarget);
  _savedCamPos = null;
  _savedCamTarget = null;
  viewer.enableCameraTracking();

  // Switch UI.
  document.getElementById('cmd-widget').style.display = 'block';
  document.getElementById('gain-info').style.display = 'none';
  document.querySelector('#live-badge span:nth-child(2)').textContent = 'Live Physics';
  document.querySelector('#live-badge .live-hint').textContent = '— WASD·QE to steer';

  responseHistory.length = 0;

  // Restart policy.
  runner.reset();
  runner.command[0] = AUTO_TARGET[0];
  runner.command[1] = AUTO_TARGET[1];
  runner.command[2] = AUTO_TARGET[2];
  runner.start();
  isPlaying = true;
  setAutoMode();
}

function resetGainTest() {
  const mujoco = viewer.getMujoco();
  const model = viewer.getModel();
  const data = viewer.getData();

  mujoco.mj_resetData(model, data);
  mujoco.mj_resetDataKeyframe(model, data, 0);
  gainTestSimTime = 0;
  responseHistory.length = 0;

  const cfg = config;
  const ctrlMap = cfg.action_to_ctrl_map;
  for (let i = 0; i < cfg.num_joints; i++) {
    const ctrlIdx = ctrlMap ? ctrlMap[i] : i;
    data.ctrl[ctrlIdx] = cfg.default_joint_pos[i];
  }

  mujoco.mj_forward(model, data);
}

let _gainTestSkip = 0;

function gainTestStep() {
  if (!gainTestActive) return;
  _gainTestAnimId = requestAnimationFrame(gainTestStep);

  const mujoco = viewer.getMujoco();
  const model = viewer.getModel();
  const data = viewer.getData();
  const cfg = config;
  const ctrlMap = cfg.action_to_ctrl_map;
  const decimation = cfg.decimation || 4;

  // Compute excitation offset.
  let excOffset = 0;
  if (gainExcMode === 'sine') {
    excOffset = GAIN_EXC_AMP * Math.sin(2 * Math.PI * GAIN_EXC_SINE_HZ * gainTestSimTime);
  } else if (gainExcMode === 'step') {
    excOffset = (Math.floor(gainTestSimTime / GAIN_EXC_STEP_PERIOD) % 2 === 0)
      ? GAIN_EXC_AMP : -GAIN_EXC_AMP;
  }

  // Set joint targets = default + excitation.
  for (let i = 0; i < cfg.num_joints; i++) {
    const ctrlIdx = ctrlMap ? ctrlMap[i] : i;
    data.ctrl[ctrlIdx] = cfg.default_joint_pos[i] + excOffset;
  }

  viewer.updateDragForces();

  // Step physics — base is truly fixed (no freejoint in this model).
  for (let s = 0; s < decimation; s++) {
    mujoco.mj_step(model, data);
    if (typeof window._dbgStepCount === 'undefined') window._dbgStepCount = 0;
    if (++window._dbgStepCount % 10 === 0) console.log('velocity_widget | mujoco physics stepping', window._dbgStepCount);
  }
  gainTestSimTime += cfg.timestep * decimation;

  // Feed joint response data (offset 0 — no base DOFs in fixed model).
  _gainTestSkip++;
  if (_gainTestSkip >= 3) {
    _gainTestSkip = 0;
    const actual = [], target = [];
    for (const j of JOINT_SUBSET) {
      actual.push(data.qpos[j.idx]);
      target.push(cfg.default_joint_pos[j.idx] + excOffset);
    }
    responseHistory.push({ actual, target });
    if (responseHistory.length > RESP_HISTORY) responseHistory.shift();
  }

  viewer.controls.update();
  viewer.render();
}

// ── Hot-swap config (no iframe reload) ───────────────
// All gain variants share the same robot/meshes and differ only in actuator
// gainprm / biasprm.  We patch those arrays in-place on the existing MjModel
// so we never call loadFromXML again (which would re-allocate meshes and
// eventually OOM the WASM linear heap).
let _swapping = false;

function patchActuatorGains(xmlText, model) {
  // Parse the new XML and extract per-actuator gainprm / biasprm.
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const actuators = doc.querySelectorAll('actuator > general');
  const MJ_NGAIN = 10; // mjNGAIN — gainprm array width per actuator
  const MJ_NBIAS = 10; // mjNBIAS — biasprm array width per actuator
  actuators.forEach((el, i) => {
    if (i >= model.nu) return;
    // gainprm — single value maps to index 0
    const gp = el.getAttribute('gainprm');
    if (gp) {
      const vals = gp.trim().split(/\s+/).map(Number);
      for (let k = 0; k < vals.length && k < MJ_NGAIN; k++) {
        model.actuator_gainprm[i * MJ_NGAIN + k] = vals[k];
      }
    }
    // biasprm — "0 -kp -kd" maps to indices 0,1,2
    const bp = el.getAttribute('biasprm');
    if (bp) {
      const vals = bp.trim().split(/\s+/).map(Number);
      for (let k = 0; k < vals.length && k < MJ_NBIAS; k++) {
        model.actuator_biasprm[i * MJ_NBIAS + k] = vals[k];
      }
    }
  });
}

async function swapConfig(newScene, newPolicy, newConfig, newColor) {
  if (_swapping) return;
  _swapping = true;

  overlayEl.classList.remove('hidden');
  const wasGainTest = gainTestActive;

  // Pause current mode but keep rendering the frozen robot.
  if (gainTestActive) {
    if (_gainTestAnimId !== null) {
      cancelAnimationFrame(_gainTestAnimId);
      _gainTestAnimId = null;
    }
    viewer.startRenderLoop();
  } else {
    runner.stop(); // stops sim, starts viewer render loop
  }

  try {
    // 1. Load new config + scene XML (for gain values only).
    statusEl.textContent = 'Loading config…';
    const [cfgResp, xmlResp] = await Promise.all([
      fetch(newConfig), fetch(newScene),
    ]);
    const newCfg = await cfgResp.json();
    const xmlText = await xmlResp.text();

    // 2. Patch actuator gains in-place on existing models (no loadFromXML).
    const walkModel = wasGainTest ? originalModel : viewer.model;
    patchActuatorGains(xmlText, walkModel);
    if (fixedModel) patchActuatorGains(xmlText, fixedModel);

    // 3. Load new ONNX policy.
    statusEl.textContent = 'Loading policy…';
    const ort = await import('onnxruntime-web');
    const newSession = await ort.InferenceSession.create(newPolicy, {
      executionProviders: ['wasm'],
    });

    // 4. Update config + runner internals.
    config = newCfg;
    runner.config = config;
    runner.session = newSession;
    runner.obsDim = config.observation_dims.reduce((a, b) => a + b, 0);
    runner.lastAction = new Float32Array(config.num_joints);

    // Update curve color.
    if (newColor) {
      curveColor = newColor;
      const activeBtn = jointSelRow.querySelector('.joint-btn.active');
      if (activeBtn) activeBtn.style.background = curveColor;
    }
    responseHistory.length = 0;
  } catch (err) {
    console.error('Config swap failed:', err);
    statusEl.textContent = 'Error: ' + err.message;
  }

  // Resume in the same mode.
  viewer.stopRenderLoop();
  if (wasGainTest) {
    gainTestSimTime = 0;
    resetGainTest();
    _gainTestAnimId = requestAnimationFrame(gainTestStep);
  } else {
    const mj = viewer.getMujoco();
    const model = viewer.getModel();
    const data = viewer.getData();
    mj.mj_resetDataKeyframe(model, data, 0);
    mj.mj_forward(model, data);
    runner.lastAction.fill(0);
    runner.command[0] = AUTO_TARGET[0];
    runner.command[1] = AUTO_TARGET[1];
    runner.command[2] = AUTO_TARGET[2];
    runner.start();
    isPlaying = true;
    setAutoMode();
  }

  overlayEl.classList.add('hidden');
  _swapping = false;
}

// Toggle button handlers.
document.getElementById('mode-walk').addEventListener('click', () => {
  if (!gainTestActive) return;
  document.getElementById('mode-walk').classList.add('active');
  document.getElementById('mode-gain').classList.remove('active');
  exitGainTestMode();
});
document.getElementById('mode-gain').addEventListener('click', () => {
  if (gainTestActive) return;
  document.getElementById('mode-gain').classList.add('active');
  document.getElementById('mode-walk').classList.remove('active');
  enterGainTestMode();
});

// Excitation mode button handlers.
document.querySelectorAll('.exc-row button').forEach(btn => {
  btn.addEventListener('click', () => {
    gainExcMode = btn.dataset.exc;
    gainTestSimTime = 0;
    responseHistory.length = 0;
    document.querySelectorAll('.exc-row button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// Set initial command to default and auto-start.
runner.command[0] = AUTO_TARGET[0];
runner.command[1] = AUTO_TARGET[1];
runner.command[2] = AUTO_TARGET[2];
runner.start();
isPlaying = true;
if (playBtn) playBtn.textContent = '⏸ Pause';

// Auto-enter gain test mode if URL says so.
if (params.get('mode') === 'gain' && fixedModel) {
  document.getElementById('mode-gain').classList.add('active');
  document.getElementById('mode-walk').classList.remove('active');
  enterGainTestMode();
}

// ══════════════════════════════════════════════════════
//  ONBOARDING TOUR
// ══════════════════════════════════════════════════════
const TOUR_KEY = 'mujoco-velocity-toured';

const TOUR_STEPS = [
  {
    target: null,
    noSpotlight: true,
    title: 'Live Neural Network',
    desc: 'A real RL policy is running in your browser right now. This humanoid robot walks using a neural network — no scripted motion.',
  },
  {
    target: null,
    noSpotlight: true,
    title: 'Gain Grid',
    desc: 'Each circle on the Kp/Kd grid represents a policy trained under different gain setpoints. Click different circles to see how the same robot behaves with soft vs. stiff control.',
    highlightParentGrid: true,
  },
  {
    target: 'response-float',
    title: 'Joint Tracking',
    desc: 'This plot shows how each joint tracks the policy\'s predicted targets. Different gain setpoints produce dramatically different tracking. Select joints below to compare.',
  },
  {
    target: 'cmd-widget',
    title: 'Take the Wheel',
    desc: 'Use W/S to walk forward/back, A/D to strafe, Q/E to turn. The policy adapts to your velocity commands in real-time. Try pressing some keys!',
    requireKeyPress: true,
  },
  {
    target: 'mode-toggle',
    title: 'Feel the Gains',
    desc: 'Switching to Gain Test mode — the robot\'s base is now fixed. Watch the demo push the robot around, or click & drag it yourself to feel how different gain setpoints affect stiffness.',
    enterGainTest: true,
    demoPhysics: true,
  },
  {
    target: null,
    noSpotlight: true,
    title: 'Explore!',
    desc: 'Switching back to Walk mode. Try different gain circles, switch between Walk and Gain Test, and see how tuning changes everything!',
    exitGainTest: true,
  },
];

// ── Tour state ────────────────────────────────────────
let tourStep = 0;
let tourActive = false;
let tourHiddenElements = [];
let tourCurrentTarget = null;
let tourKeyPressActive = false;      // true while waiting for user keypress
let userHasPressedKey = false;
let tourDemoPhysicsActive = false;   // true while gain test demo is running
let userHasDraggedInTour = false;    // unlocks Next once user drags during demo

// ── Demo drag state ──────────────────────────────────
let demoDragActive = false;
let demoDragStartTime = 0;
let demoDragBodyIdx = 0;
let lastBodySwitch = 0;
// Candidate bodies to push (skip world=0 and base=1)
const DEMO_BODIES = [4, 6, 8, 10, 12, 14, 3, 5, 9, 11];

function pickDemoBody() {
  const model = viewer.getModel();
  if (!model) return 3;
  demoDragBodyIdx = (demoDragBodyIdx + 1) % DEMO_BODIES.length;
  let bid = DEMO_BODIES[demoDragBodyIdx];
  if (bid >= model.nbody) bid = Math.min(3, model.nbody - 1);
  return bid;
}

function startDemoPhysics() {
  if (!fixedModel || !viewer._dragArrow) return;

  const bid = pickDemoBody();
  viewer._dragBodyId = bid;
  viewer._dragPointLocal.set(0, 0, 0);
  viewer._dragging = true;  // must be set before _updateDragAnchor

  // Sync body transforms so we can compute anchor
  viewer.render();
  viewer._updateDragAnchor();
  viewer._dragCursorWorld.copy(viewer._dragPointWorld);

  viewer.controls.enabled = false;
  demoDragActive = true;
  demoDragStartTime = performance.now();
  lastBodySwitch = 0;

  tickDemoDrag();
}

function tickDemoDrag() {
  if (!demoDragActive) return;
  requestAnimationFrame(tickDemoDrag);

  const t = (performance.now() - demoDragStartTime) / 1000;

  // Switch body every 3.5 seconds
  if (t - lastBodySwitch > 3.5) {
    lastBodySwitch = t;
    const bid = pickDemoBody();
    viewer._dragBodyId = bid;
    viewer._dragPointLocal.set(0, 0, 0);
  }

  viewer._updateDragAnchor();
  viewer._dragCursorWorld.copy(viewer._dragPointWorld);

  // Tanh-squared sine for smooth push-and-hold (matching fr3_widget)
  const amp = 0.50;
  const freq = 0.20;
  const squeeze = 6;
  const phase = 2 * Math.PI * freq * t;
  const push = amp * Math.tanh(squeeze * Math.sin(phase));

  // Rotate push direction slowly
  const angle = t * 0.4;
  viewer._dragCursorWorld.x += push * Math.cos(angle);
  viewer._dragCursorWorld.z += push * 0.6 * Math.sin(angle);
  viewer._dragCursorWorld.y += push * 0.3 * Math.sin(t * 0.25); // slight vertical
}

function stopDemoPhysics() {
  demoDragActive = false;
  viewer._dragging = false;
  viewer._dragBodyId = -1;
  if (viewer._dragArrow) viewer._dragArrow.visible = false;
  if (viewer.data) {
    for (let i = 0; i < viewer.data.qfrc_applied.length; i++) {
      viewer.data.qfrc_applied[i] = 0;
    }
  }
  setTimeout(() => { viewer.controls.enabled = true; }, 0);
}

// Monkey-patch viewer pointer handlers for demo drag support.
// The viewer's event lambdas call this._onPointerDown(e) at invocation time,
// so replacing the method on the instance shadows the prototype.
const _origPointerDown = viewer._onPointerDown.bind(viewer);
const _origPointerMove = viewer._onPointerMove.bind(viewer);
const _origPointerUp   = viewer._onPointerUp.bind(viewer);

viewer._onPointerDown = function(e) {
  if (demoDragActive) {
    // User clicks during demo → stop demo, let viewer start a fresh drag
    demoDragActive = false;
    viewer._dragging = false;
    viewer._dragBodyId = -1;
    if (viewer._dragArrow) viewer._dragArrow.visible = false;
    if (viewer.data) {
      for (let i = 0; i < viewer.data.qfrc_applied.length; i++) {
        viewer.data.qfrc_applied[i] = 0;
      }
    }
  }
  _origPointerDown(e);
};

viewer._onPointerMove = function(e) {
  if (demoDragActive) return;  // demo controls the cursor
  _origPointerMove(e);
};

viewer._onPointerUp = function(e) {
  const wasDragging = viewer._dragging;
  _origPointerUp(e);
  // Restart demo after user releases during tour
  if (tourDemoPhysicsActive && wasDragging && !demoDragActive) {
    if (!userHasDraggedInTour) {
      userHasDraggedInTour = true;
      document.getElementById('tour-next').disabled = false;
    }
    setTimeout(() => {
      if (tourDemoPhysicsActive) startDemoPhysics();
    }, 800);
  }
};

// ── Tour navigation ──────────────────────────────────

function showOnboardingIfNeeded() {
  if (localStorage.getItem(TOUR_KEY)) return;
  setTimeout(startTour, 2500);
}

function startTour() {
  tourStep = 0;
  tourActive = true;
  tourHiddenElements = [];
  tourCurrentTarget = null;
  showTourStep(tourStep);
}

function showTourStep(idx) {
  const spotlight = document.getElementById('tour-spotlight');
  const tooltip   = document.getElementById('tour-tooltip');
  const stepNumEl = document.getElementById('tour-step-num');
  const titleEl   = document.getElementById('tour-title');
  const descEl    = document.getElementById('tour-desc');
  const progressEl= document.getElementById('tour-progress');
  const nextBtn   = document.getElementById('tour-next');

  // Clean up previous step state
  stopDemoPhysics();
  tourDemoPhysicsActive = false;
  tourKeyPressActive = false;
  nextBtn.disabled = false;
  // Remove parent grid highlight from previous step
  try { window.parent.postMessage({ type: 'tour-highlight-grid', active: false }, '*'); } catch(_) {}

  // Remove elevation from previous target
  if (tourCurrentTarget) {
    tourCurrentTarget.classList.remove('tour-target-elevated');
  }

  if (idx >= TOUR_STEPS.length) {
    endTour();
    return;
  }

  const step     = TOUR_STEPS[idx];
  const targetEl = step.target ? document.getElementById(step.target) : null;

  // Auto-switch modes
  if (step.enterGainTest && !gainTestActive && fixedModel) {
    document.getElementById('mode-gain').classList.add('active');
    document.getElementById('mode-walk').classList.remove('active');
    enterGainTestMode();
  }
  if (step.exitGainTest && gainTestActive) {
    document.getElementById('mode-walk').classList.add('active');
    document.getElementById('mode-gain').classList.remove('active');
    exitGainTestMode();
  }

  if (!targetEl) {
    // Floating step — no spotlight
    spotlight.classList.add('hidden');
    tourCurrentTarget = null;

    requestAnimationFrame(() => {
      stepNumEl.textContent  = idx + 1;
      titleEl.textContent    = step.title;
      descEl.textContent     = step.desc;
      progressEl.textContent = `${idx + 1} of ${TOUR_STEPS.length}`;
      nextBtn.textContent    = idx === 0 ? 'Start Tour' : idx === TOUR_STEPS.length - 1 ? 'Done' : 'Next';

      tooltip.style.left    = '12px';
      tooltip.style.top     = Math.max(10, window.innerHeight - 230) + 'px';
      tooltip.dataset.arrow = 'none';
      tooltip.classList.toggle('tour-intro', !!step.noSpotlight);
      tooltip.classList.remove('hidden');
    });

    // Highlight parent gain grid if requested
    if (step.highlightParentGrid) {
      try { window.parent.postMessage({ type: 'tour-highlight-grid', active: true }, '*'); } catch(_) {}
    }

    // Start demo physics if requested (after a short delay for mode switch)
    if (step.demoPhysics) {
      tourDemoPhysicsActive = true;
      userHasDraggedInTour = false;
      const nextBtn = document.getElementById('tour-next');
      nextBtn.disabled = true;
      setTimeout(() => {
        if (tourDemoPhysicsActive) startDemoPhysics();
      }, 500);
    }

    return;
  }

  // Temporarily reveal if hidden
  if (targetEl.style.display === 'none') {
    targetEl.style.display = '';
    tourHiddenElements.push(targetEl);
  }

  // Spotlight
  if (!step.noSpotlight) {
    targetEl.classList.add('tour-target-elevated');
    tourCurrentTarget = targetEl;
  } else {
    spotlight.classList.add('hidden');
    tourCurrentTarget = null;
  }

  requestAnimationFrame(() => {
    const rect    = targetEl.getBoundingClientRect();
    const padding = 8;

    if (!step.noSpotlight) {
      spotlight.style.top    = (rect.top    - padding) + 'px';
      spotlight.style.left   = (rect.left   - padding) + 'px';
      spotlight.style.width  = (rect.width  + padding * 2) + 'px';
      spotlight.style.height = (rect.height + padding * 2) + 'px';
      spotlight.classList.remove('hidden');
    }

    stepNumEl.textContent  = idx + 1;
    titleEl.textContent    = step.title;
    descEl.textContent     = step.desc;
    progressEl.textContent = `${idx + 1} of ${TOUR_STEPS.length}`;
    nextBtn.textContent    = idx === TOUR_STEPS.length - 1 ? 'Done' : 'Next';

    tooltip.style.left    = '12px';
    tooltip.style.top     = Math.max(10, window.innerHeight - 230) + 'px';
    tooltip.dataset.arrow = 'none';
    tooltip.classList.remove('tour-intro');
    tooltip.classList.remove('hidden');

    // Per-step side-effects
    if (step.requireKeyPress) {
      tourKeyPressActive = true;
      userHasPressedKey = false;
      nextBtn.disabled = true;
    }

    if (step.demoPhysics) {
      tourDemoPhysicsActive = true;
      userHasDraggedInTour = false;
      nextBtn.disabled = true;   // unlocked once user drags at least once
      setTimeout(() => {
        if (tourDemoPhysicsActive) startDemoPhysics();
      }, 500);
    }
  });
}

function endTour() {
  const spotlight = document.getElementById('tour-spotlight');
  const tooltip   = document.getElementById('tour-tooltip');

  stopDemoPhysics();
  tourDemoPhysicsActive = false;
  tourKeyPressActive = false;
  userHasDraggedInTour = false;
  document.getElementById('tour-next').disabled = false;

  spotlight.classList.add('hidden');
  tooltip.classList.add('hidden');

  if (tourCurrentTarget) {
    tourCurrentTarget.classList.remove('tour-target-elevated');
    tourCurrentTarget = null;
  }

  tourHiddenElements.forEach(el => { el.style.display = 'none'; });
  tourHiddenElements = [];
  tourActive = false;
  localStorage.setItem(TOUR_KEY, '1');

  // Remove parent gain grid highlight
  try { window.parent.postMessage({ type: 'tour-highlight-grid', active: false }, '*'); } catch(_) {}

  // Ensure we're back in walk mode
  if (gainTestActive) {
    document.getElementById('mode-walk').classList.add('active');
    document.getElementById('mode-gain').classList.remove('active');
    exitGainTestMode();
  }
}

// Tour button handlers
document.getElementById('tour-next')?.addEventListener('click', () => {
  tourStep++;
  showTourStep(tourStep);
});
document.getElementById('tour-skip')?.addEventListener('click', () => {
  endTour();
});

// Escape exits tour
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && tourActive) endTour();
});

// Detect key presses for the "Take the Wheel" step
window.addEventListener('keydown', (e) => {
  if (tourKeyPressActive && !userHasPressedKey) {
    const movementKeys = ['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
    if (movementKeys.includes(e.code)) {
      userHasPressedKey = true;
      document.getElementById('tour-next').disabled = false;
    }
  }
});

// Show onboarding for first-time visitors
showOnboardingIfNeeded();
</script>
</body>
