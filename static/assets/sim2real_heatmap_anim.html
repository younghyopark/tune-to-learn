<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Animated Sim2Real Heatmap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  canvas { display: block; }
  .caption {
    font-size: 15px;
    margin-top: 8px;
    text-align: center;
    color: #111;
  }
</style>
</head>
<body>
<div class="container">
  <canvas id="heatmap"></canvas>
  <div class="caption">Sim-to-Real Transfer Error (log MSE)</div>
</div>

<script>
(function() {
  'use strict';

  // ======== DATA from sim2real_data/summary.json ========
  const kps = [16,32,64,128,160,256,512];
  const kds = [1,2,4,8,12,16,24];
  // heatmap[i][j] = log10(MSE) for kd=kds[i], kp=kps[j]
  // More negative = better transfer (darker blue)
  const heatmap = [
    [-1.94,-1.87,-2.36,-2.19,-1.78,-1.99,-1.97],
    [-1.96,-1.98,-2.10,-2.11,-2.09,-2.10,-1.91],
    [-2.24,-2.32,-2.19,-2.02,-2.25,-2.23,-2.07],
    [-1.98,-2.31,-2.29,-2.27,-2.26,-1.55,-0.93],
    [-2.27,-2.20,-2.41,-2.44,-2.26,-2.03,-1.34],
    [-1.90,-2.35,-2.12,-1.43,-1.37,-2.27,-0.82],
    [-0.88,-1.56,-2.09,-0.97,-1.11,-1.25,-1.86]
  ];

  const rows = kds.length, cols = kps.length;

  // ======== Blues colormap (reversed: low value = dark blue) ========
  const BLUES_R = [
    [0.000,   8,  48, 107],
    [0.125,   8,  81, 156],
    [0.250,  33, 113, 181],
    [0.375,  66, 146, 198],
    [0.500, 107, 174, 214],
    [0.625, 158, 202, 225],
    [0.750, 198, 219, 239],
    [0.875, 222, 235, 247],
    [1.000, 247, 251, 255],
  ];

  function bluesColor(t) {
    t = Math.max(0, Math.min(1, t));
    let i = 0;
    while (i < BLUES_R.length - 2 && BLUES_R[i+1][0] < t) i++;
    const [t0,r0,g0,b0] = BLUES_R[i];
    const [t1,r1,g1,b1] = BLUES_R[i+1];
    const f = t1 > t0 ? (t - t0)/(t1 - t0) : 0;
    return `rgb(${Math.round(r0+(r1-r0)*f)},${Math.round(g0+(g1-g0)*f)},${Math.round(b0+(b1-b0)*f)})`;
  }

  // Normalize: map heatmap range to 0-1 where 0 = most negative (best, darkest)
  let minVal = Infinity, maxVal = -Infinity;
  for (let i = 0; i < rows; i++)
    for (let j = 0; j < cols; j++) {
      if (heatmap[i][j] < minVal) minVal = heatmap[i][j];
      if (heatmap[i][j] > maxVal) maxVal = heatmap[i][j];
    }

  function normalize(v) {
    // 0 = minVal (darkest), 1 = maxVal (lightest)
    return maxVal > minVal ? (v - minVal) / (maxVal - minVal) : 0;
  }

  // ======== LAYOUT ========
  const cellW = 56, cellH = 44;
  const axisX = 30;    // left margin
  const axisY = 16;    // bottom margin
  const topPad = 30;   // above grid for Kd arrow tip + label
  const rightPad = 40; // right for Kp arrow tip + label
  const gridW = cols * cellW, gridH = rows * cellH;
  const totalW = axisX + gridW + rightPad;
  const totalH = topPad + gridH + axisY;

  const canvas = document.getElementById('heatmap');

  function setupCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = totalW * dpr;
    canvas.height = totalH * dpr;
    canvas.style.width = totalW + 'px';
    canvas.style.height = totalH + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  // ======== DRAW FAINT GRID LINES ========
  function drawGridLines(ctx, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= rows; i++) {
      const y = topPad + i * cellH;
      ctx.beginPath(); ctx.moveTo(axisX, y); ctx.lineTo(axisX + gridW, y); ctx.stroke();
    }
    for (let j = 0; j <= cols; j++) {
      const x = axisX + j * cellW;
      ctx.beginPath(); ctx.moveTo(x, topPad); ctx.lineTo(x, topPad + gridH); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // ======== DRAW ARROW AXES ========
  function drawAxes(ctx, axisProgress) {
    const ox = axisX, oy = topPad;
    const arrowLen = 12, arrowW = 5;
    const p = Math.max(0, Math.min(1, axisProgress));

    ctx.strokeStyle = '#333';
    ctx.fillStyle = '#333';
    ctx.lineWidth = 1.8;

    // X-axis
    const xEnd = ox + gridW + 10;
    const xCur = ox + (xEnd - ox) * p;
    ctx.beginPath(); ctx.moveTo(ox, oy + gridH + 1); ctx.lineTo(xCur, oy + gridH + 1); ctx.stroke();
    if (p > 0.1) {
      ctx.beginPath();
      ctx.moveTo(xCur, oy + gridH + 1);
      ctx.lineTo(xCur - arrowLen, oy + gridH + 1 - arrowW);
      ctx.lineTo(xCur - arrowLen, oy + gridH + 1 + arrowW);
      ctx.closePath(); ctx.fill();
    }

    // Y-axis
    const yEnd = oy - 8;
    const yCur = oy + gridH + (yEnd - oy - gridH) * p;
    ctx.beginPath(); ctx.moveTo(ox - 1, oy + gridH); ctx.lineTo(ox - 1, yCur); ctx.stroke();
    if (p > 0.1) {
      ctx.beginPath();
      ctx.moveTo(ox - 1, yCur);
      ctx.lineTo(ox - 1 - arrowW, yCur + arrowLen);
      ctx.lineTo(ox - 1 + arrowW, yCur + arrowLen);
      ctx.closePath(); ctx.fill();
    }

    // Axis labels
    if (p > 0.3) {
      const labelAlpha = Math.min(1, (p - 0.3) / 0.4);
      ctx.globalAlpha = labelAlpha;

      // Kp
      ctx.font = 'italic 16px Inter, -apple-system, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const kpX = xEnd + 4;
      ctx.fillText('K', kpX, oy + gridH + 1);
      const kW = ctx.measureText('K').width;
      ctx.font = 'italic 11px Inter, -apple-system, sans-serif';
      ctx.fillText('p', kpX + kW, oy + gridH + 1 + 3);

      // Kd
      ctx.font = 'italic 16px Inter, -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      const kdY = yEnd - 4;
      ctx.fillText('K', ox - 1, kdY);
      const kW2 = ctx.measureText('K').width;
      ctx.font = 'italic 11px Inter, -apple-system, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('d', ox - 1 + kW2 / 2, kdY + 3);

      ctx.globalAlpha = 1;
    }
  }

  // ======== DRAW HEATMAP CELLS ========
  function drawCells(ctx, heatProgress) {
    const ox = axisX, oy = topPad;

    for (let i = 0; i < rows; i++) {
      const displayRow = rows - 1 - i;
      for (let j = 0; j < cols; j++) {
        const x = ox + j * cellW;
        const y = oy + displayRow * cellH;
        const rawVal = heatmap[i][j];

        // Animate: interpolate from maxVal (lightest) toward actual value
        const animVal = maxVal + (rawVal - maxVal) * heatProgress;
        const t = normalize(animVal);

        ctx.fillStyle = bluesColor(t);
        ctx.fillRect(x, y, cellW, cellH);

        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, cellW, cellH);

        // Value text — show the animated value
        if (heatProgress > 0.05) {
          ctx.fillStyle = t < 0.4 ? '#fff' : '#333';
          ctx.font = 'bold 12px Inter, -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(animVal.toFixed(2), x + cellW / 2, y + cellH / 2);
        }
      }
    }
  }

  // ======== ANIMATION ========
  const MAIN_DUR = 2000;
  let startTime = null;

  function ease(t) {
    t = Math.max(0, Math.min(1, t));
    return 1 - Math.pow(1 - t, 3);
  }

  function animate(now) {
    if (!startTime) startTime = now;
    const t = now - startTime;
    const p = ease(t / MAIN_DUR);

    const ctx = setupCanvas();
    ctx.clearRect(0, 0, totalW, totalH);
    if (p > 0) drawGridLines(ctx, 0.3 * Math.min(1, p));
    if (p > 0) drawCells(ctx, p);
    drawAxes(ctx, p);

    if (t < MAIN_DUR) {
      requestAnimationFrame(animate);
    }
  }

  // Initial empty state
  const ctx = setupCanvas();
  ctx.clearRect(0, 0, totalW, totalH);
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
