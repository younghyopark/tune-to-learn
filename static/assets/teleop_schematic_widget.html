<!--
  Teleop Input Mapping Schematic with Sequential Reveal + Signal Flow Animation
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleop Schematic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function() {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '-apple-system, BlinkMacSystemFont, sans-serif';

  const BLOCKS = [
    { label: 'Human',                type: 'text' },
    { label: 'Teleoperation\nDevice', sublabel: '(e.g. SpaceMouse,\nKinematic Double, ..)', type: 'text' },
    { label: 'Input\nMapping',        type: 'box', color: '#2c5f7c' },
    { label: 'Position\nTarget',      type: 'text' },
    { label: 'Impedance\nController', type: 'box', color: '#2c5f7c' },
    { label: 'Torque/\nCurrent',      type: 'text' },
  ];

  // Each "element" is a block or an arrow between blocks
  // Total reveal items: block0, arrow0, block1, arrow1, ..., block5
  // = 6 blocks + 5 arrows = 11 items
  const TOTAL_ITEMS = BLOCKS.length + (BLOCKS.length - 1); // 11
  const REVEAL_DELAY = 250; // ms per item
  const FADE_DURATION = 300; // ms to fade in each item

  const particles = [];
  const PARTICLE_SPEED = 2.5;
  const SPAWN_INTERVAL = 40;
  let frameCount = 0;
  let animRAF = null;
  let revealStart = 0;
  let started = false;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function getItemAlpha(itemIndex, now) {
    const itemStart = revealStart + itemIndex * REVEAL_DELAY;
    const elapsed = now - itemStart;
    if (elapsed <= 0) return 0;
    return Math.min(1, elapsed / FADE_DURATION);
  }

  function layout(W, H) {
    const boxW = 90, boxH = 50;
    const totalW = W - 60;
    const startX = 30;
    const cy = H / 2 - 5;
    const n = BLOCKS.length;
    const positions = [];
    for (let i = 0; i < n; i++) {
      positions.push({ x: startX + (i / (n - 1)) * totalW, y: cy });
    }
    return { positions, boxW, boxH, cy };
  }

  function draw() {
    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    if (W === 0) return;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const now = performance.now();
    const { positions, boxW, boxH, cy } = layout(W, H);
    const arrowSize = 6;

    // Compute arrow segments
    const segments = [];
    for (let i = 0; i < BLOCKS.length - 1; i++) {
      const b = BLOCKS[i];
      const p1 = positions[i], p2 = positions[i + 1];
      let x1 = b.type === 'box' ? p1.x + boxW / 2 + 4 : p1.x + 35;
      let x2 = BLOCKS[i + 1].type === 'box' ? p2.x - boxW / 2 - 4 : p2.x - 35;
      segments.push({ x1, x2, y: cy });
    }

    // Draw arrows (item indices: 1, 3, 5, 7, 9)
    for (let i = 0; i < segments.length; i++) {
      const itemIdx = i * 2 + 1; // arrow items are odd indices
      const alpha = getItemAlpha(itemIdx, now);
      if (alpha <= 0) continue;

      const seg = segments[i];
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#555';
      ctx.fillStyle = '#555';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(seg.x1, cy);
      ctx.lineTo(seg.x2, cy);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(seg.x2, cy);
      ctx.lineTo(seg.x2 - arrowSize, cy - arrowSize);
      ctx.lineTo(seg.x2 - arrowSize, cy + arrowSize);
      ctx.closePath();
      ctx.fill();
    }

    // Draw blocks (item indices: 0, 2, 4, 6, 8, 10)
    for (let i = 0; i < BLOCKS.length; i++) {
      const itemIdx = i * 2; // block items are even indices
      const alpha = getItemAlpha(itemIdx, now);
      if (alpha <= 0) continue;

      ctx.globalAlpha = alpha;
      const b = BLOCKS[i];
      const p = positions[i];

      if (b.type === 'box') {
        const rx = p.x - boxW / 2, ry = p.y - boxH / 2;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(rx, ry, boxW, boxH, 6);
        ctx.fill();

        ctx.fillStyle = '#fff';
        ctx.font = `bold 13px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const lines = b.label.split('\n');
        const lh = 16;
        const sy = p.y - ((lines.length - 1) * lh) / 2;
        lines.forEach((l, li) => ctx.fillText(l, p.x, sy + li * lh));
      } else {
        ctx.fillStyle = '#333';
        ctx.font = `bold 14px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const lines = b.label.split('\n');
        const lh = 16;
        const sy = p.y - ((lines.length - 1) * lh) / 2;
        lines.forEach((l, li) => ctx.fillText(l, p.x, sy + li * lh));

        if (b.sublabel) {
          ctx.font = `italic 11px ${FONT}`;
          ctx.fillStyle = '#888';
          const subs = b.sublabel.split('\n');
          subs.forEach((l, li) => ctx.fillText(l, p.x, sy + lines.length * lh + li * 13 + 2));
        }
      }
    }

    // Only spawn particles after all items are revealed
    const allRevealed = now > revealStart + TOTAL_ITEMS * REVEAL_DELAY + FADE_DURATION;

    ctx.globalAlpha = 1;

    if (allRevealed) {
      frameCount++;
      if (frameCount % SPAWN_INTERVAL === 0 && segments.length > 0) {
        particles.push({ seg: 0, x: segments[0].x1, y: segments[0].y });
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const seg = segments[p.seg];
        p.x += PARTICLE_SPEED;

        if (p.x >= seg.x2) {
          p.seg++;
          if (p.seg >= segments.length) { particles.splice(i, 1); continue; }
          p.x = segments[p.seg].x1;
          p.y = segments[p.seg].y;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#4a90d9';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(74,144,217,0.2)';
        ctx.fill();
      }
    }
  }

  function animate() {
    draw();
    animRAF = requestAnimationFrame(animate);
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        if (!started) {
          started = true;
          revealStart = performance.now();
        }
        if (!animRAF) animate();
      } else {
        if (animRAF) { cancelAnimationFrame(animRAF); animRAF = null; }
      }
    });
  }, { threshold: 0.1 });
  observer.observe(canvas);
})();
</script>
</body>
</html>
