<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gain Regime Schematic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100%;
    overflow: visible;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px 10px 10px;
    max-width: 820px;
    width: 100%;
  }
  .panels {
    display: flex;
    gap: 32px;
    justify-content: center;
    align-items: flex-end;
    width: 100%;
  }
  .panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex: 1;
    max-width: 230px;
  }
  .panel canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
  }
  .panel-label {
    font-size: 15px;
    font-weight: 600;
    color: #222;
    letter-spacing: 0.01em;
    height: 22px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .panel-label .tag {
    font-size: 11px;
    font-weight: 500;
    padding: 1px 7px;
    border-radius: 3px;
    color: #fff;
  }
  .tag-bc, .tag-rl, .tag-s2r {
    background: #333;
  }

  .panel-label .label-text {}

  /* Mobile: keep row, maximize space */
  @media (max-width: 560px) {
    .wrap {
      padding: 6px 2px 4px;
      gap: 4px;
    }
    .panels {
      gap: 6px;
    }
    .panel {
      max-width: none;
      gap: 4px;
    }
    .panel-label {
      font-size: 9px;
      gap: 0;
      height: auto;
      flex-direction: column;
    }
    .panel-label .tag {
      font-size: 9px;
      padding: 1px 6px;
    }
    .panel-label .label-text {
      display: none;
    }
    .caption {
      font-size: 10px;
      padding: 0 8px;
      text-align: center;
    }
  }

  .caption {
    font-size: 12.5px;
    color: #666;
    text-align: left;
    line-height: 1.5;
    max-width: 700px;
    padding: 0 10px;
  }
  .caption b { color: #333; font-weight: 600; }
  .replay-btn {
    font-size: 12px;
    padding: 0;
    border: none;
    background: none;
    color: #888;
    cursor: pointer;
    font-family: inherit;
    text-decoration: underline;
    text-decoration-color: #ccc;
    text-underline-offset: 2px;
    margin-left: 2px;
  }
  .replay-btn:hover {
    color: #444;
    text-decoration-color: #888;
  }

  /* Mouse-following tooltip */
  #tooltip {
    position: fixed;
    background: rgba(30, 30, 30, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #eee;
    font-size: 11.5px;
    line-height: 1.5;
    padding: 8px 12px;
    border-radius: 5px;
    width: 230px;
    text-align: left;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panels">
    <div class="panel" data-tip="Compliant, overdamped gains consistently achieve the highest success rates — often outperforming stiff counterparts by over 30%. Counterintuitively, stiff gains yield lower training loss but worse task performance.">
      <canvas id="c0"></canvas>
      <div class="panel-label"><span class="tag tag-bc">BC</span><span class="label-text">Behavior Cloning</span></div>
    </div>
    <div class="panel" data-tip="RL can discover successful solutions across all gain settings when hyperparameters are properly tuned. No single gain regime is consistently easier to optimize — the landscape varies by task.">
      <canvas id="c1"></canvas>
      <div class="panel-label"><span class="tag tag-rl">RL</span><span class="label-text">Reinforcement Learning</span></div>
    </div>
    <div class="panel" data-tip="Despite being easiest to model in simulation, stiff and overdamped gains produce the worst sim-to-real transfer. Compliant gains act as a natural low-pass filter that absorbs sim-to-real discrepancies.">
      <canvas id="c2"></canvas>
      <div class="panel-label"><span class="tag tag-s2r">S2R</span><span class="label-text">Sim-to-Real</span></div>
    </div>
  </div>
  <div class="caption"><b>Colored regions indicate preferred gain regimes</b> for each learning paradigm. White regions indicate gain settings where performance degrades. Hover over each panel for details. <button class="replay-btn" id="replayBtn">&#8635; Replay</button></div>
</div>
<div id="tooltip"></div>

<script>
(function() {
  'use strict';

  const N = 6;

  // ── Corner colors (the 4 gain regimes)
  // u = Kp fraction (0=left/compliant, 1=right/stiff)
  // v = Kd fraction (0=bottom/underdamped, 1=top/overdamped)
  //
  // Top-left     (u=0, v=1): compliant overdamped  = RED
  // Top-right    (u=1, v=1): stiff overdamped      = PURPLE
  // Bottom-right (u=1, v=0): stiff underdamped     = BLUE
  // Bottom-left  (u=0, v=0): compliant underdamped = GRAY

  const C_TL = [196, 78, 82];    // red
  const C_TR = [130, 90, 160];   // purple
  const C_BR = [76, 114, 176];   // blue
  const C_BL = [140, 140, 148];  // gray

  function lerp(a, b, t) { return a + (b - a) * t; }

  // Bilinear interpolation of corner colors
  function baseColor(u, v) {
    return [0, 1, 2].map(ch => {
      const bottom = lerp(C_BL[ch], C_BR[ch], u);
      const top    = lerp(C_TL[ch], C_TR[ch], u);
      return lerp(bottom, top, v);
    });
  }

  // Mix color toward white based on saturation (0 = full white, 1 = full color)
  function mixWhite(rgb, sat) {
    return rgb.map(ch => lerp(255, ch, sat));
  }

  // ── Per-paradigm saturation masks
  // u = col/(N-1), v = row/(N-1) where row 0 = bottom (low Kd).

  // BC: only upper-left lit
  function bcSat(u, v) {
    const d = Math.sqrt(u * u + (1 - v) * (1 - v));
    return Math.max(0, 1 - d * 1.1);
  }

  // RL: all regions visible
  function rlSat(u, v) {
    return 0.7 + 0.3 * (1 - Math.sqrt(u * u + (1 - v) * (1 - v)) * 0.3);
  }

  // Sim2Real: upper-right washed out
  function s2rSat(u, v) {
    const dTopRight = Math.sqrt((1 - u) * (1 - u) + (1 - v) * (1 - v));
    const t = Math.max(0, (dTopRight - 0.25) / 0.8);
    return Math.min(1, t) * 0.85;
  }

  const satFns = [bcSat, rlSat, s2rSat];

  // ── Canvas setup
  const canvases = [
    document.getElementById('c0'),
    document.getElementById('c1'),
    document.getElementById('c2'),
  ];
  const ctxs = canvases.map(c => c.getContext('2d'));

  const DPR = window.devicePixelRatio || 1;
  const PAD_LEFT = 30;
  const PAD_BOTTOM = 28;
  const PAD_TOP = 16;
  const PAD_RIGHT = 16;

  function sizeCanvases() {
    canvases.forEach(c => {
      const w = c.clientWidth;
      c.width = w * DPR;
      c.height = w * DPR;
    });
  }
  sizeCanvases();
  window.addEventListener('resize', () => { sizeCanvases(); render(); });

  // ── Animation
  const PANEL_STAGGER = 800;
  const CELL_FADE_DURATION = 600;
  const WAVE_SPREAD = 350;

  let animStart = 0;
  let animId = null;

  function easeOutCubic(t) { return 1 - Math.pow(1 - Math.min(t, 1), 3); }

  const waveOrigins = [
    [0, 1],      // BC: top-left
    [0.5, 0.5],  // RL: center
    [0, 0],      // S2R: bottom-left
  ];

  function maxDist(origin) {
    let m = 0;
    for (const cu of [0, 1]) for (const cv of [0, 1]) {
      m = Math.max(m, Math.sqrt((cu - origin[0]) ** 2 + (cv - origin[1]) ** 2));
    }
    return m;
  }
  const waveDists = waveOrigins.map(maxDist);

  function cellProgress(panelIdx, col, row, now) {
    const elapsed = now - animStart - panelIdx * PANEL_STAGGER;
    if (elapsed <= 0) return 0;

    const origin = waveOrigins[panelIdx];
    const u = col / (N - 1);
    const v = row / (N - 1);
    const dist = Math.sqrt((u - origin[0]) ** 2 + (v - origin[1]) ** 2) / waveDists[panelIdx];

    const cellDelay = dist * WAVE_SPREAD;
    const cellElapsed = elapsed - cellDelay;
    if (cellElapsed <= 0) return 0;

    return easeOutCubic(cellElapsed / CELL_FADE_DURATION);
  }

  // ── Draw one panel
  function drawPanel(idx, now) {
    const ctx = ctxs[idx];
    const canvas = canvases[idx];
    const w = canvas.width;
    const h = canvas.height;
    const pl = PAD_LEFT * DPR;
    const pr = PAD_RIGHT * DPR;
    const pt = PAD_TOP * DPR;
    const pb = PAD_BOTTOM * DPR;

    ctx.clearRect(0, 0, w, h);
    ctx.save();

    const gridW = w - pl - pr;
    const gridH = h - pt - pb;
    const cellW = gridW / N;
    const cellH = gridH / N;
    const satFn = satFns[idx];

    for (let row = 0; row < N; row++) {
      for (let col = 0; col < N; col++) {
        const u = col / (N - 1);
        const v = row / (N - 1);
        const displayRow = (N - 1 - row);
        const x = pl + col * cellW;
        const y = pt + displayRow * cellH;

        const progress = cellProgress(idx, col, row, now);
        const base = baseColor(u, v);
        const sat = satFn(u, v) * progress;
        const rgb = mixWhite(base, sat);

        ctx.fillStyle = `rgb(${rgb[0]|0},${rgb[1]|0},${rgb[2]|0})`;
        ctx.fillRect(x, y, cellW, cellH);
      }
    }

    // Grid lines on top of cells (extend outside: vertical above, horizontal right)
    const tick = 4 * DPR;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
    ctx.lineWidth = 1;
    for (let i = 1; i < N; i++) {
      const x = pl + i * cellW;
      ctx.beginPath(); ctx.moveTo(x, pt - tick); ctx.lineTo(x, pt + gridH); ctx.stroke();
      const y = pt + i * cellH;
      ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(pl + gridW + tick, y); ctx.stroke();
    }

    // Outer border: bottom+left black, top+right gray
    ctx.lineWidth = 1 * DPR;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.12)';
    ctx.beginPath();
    ctx.moveTo(pl, pt);
    ctx.lineTo(pl + gridW, pt);
    ctx.lineTo(pl + gridW, pt + gridH);
    ctx.stroke();
    // Bottom + left (black)
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2 * DPR;
    ctx.beginPath();
    ctx.moveTo(pl + gridW, pt + gridH);
    ctx.lineTo(pl, pt + gridH);
    ctx.lineTo(pl, pt);
    ctx.stroke();

    // Axes
    const arrowSize = 6 * DPR;
    const fontSize = 14 * DPR;
    ctx.fillStyle = '#222';
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1.5 * DPR;

    // Kp arrow (flush with bottom edge, tip extends into right padding)
    const gridBottom = pt + gridH;
    const gridRight = pl + gridW;
    const arrowY = gridBottom;
    const kpTip = gridRight + pr - 2 * DPR;
    ctx.beginPath();
    ctx.moveTo(pl, arrowY);
    ctx.lineTo(kpTip, arrowY);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(kpTip, arrowY);
    ctx.lineTo(kpTip - arrowSize, arrowY - arrowSize * 0.5);
    ctx.lineTo(kpTip - arrowSize, arrowY + arrowSize * 0.5);
    ctx.fill();
    ctx.font = `italic ${fontSize}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('Kp', pl + gridW / 2, arrowY + 5 * DPR);

    // Kd arrow (flush with left edge, tip extends into top padding)
    const arrowX = pl;
    const kdTip = 2 * DPR;
    ctx.beginPath();
    ctx.moveTo(arrowX, gridBottom);
    ctx.lineTo(arrowX, kdTip);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(arrowX, kdTip);
    ctx.lineTo(arrowX - arrowSize * 0.5, kdTip + arrowSize);
    ctx.lineTo(arrowX + arrowSize * 0.5, kdTip + arrowSize);
    ctx.fill();
    ctx.save();
    ctx.translate(arrowX - 6 * DPR, pt + gridH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('Kd', 0, 0);
    ctx.restore();

    ctx.restore();
  }

  // ── Render loop
  function render() {
    const now = performance.now();
    for (let i = 0; i < 3; i++) {
      drawPanel(i, now);
    }
    const totalDuration = 2 * PANEL_STAGGER + WAVE_SPREAD + CELL_FADE_DURATION;
    if (now - animStart < totalDuration) {
      animId = requestAnimationFrame(render);
    }
  }

  function startAnimation() {
    if (animId) cancelAnimationFrame(animId);
    animStart = performance.now();
    render();
  }

  document.getElementById('replayBtn').addEventListener('click', startAnimation);

  // Animate on scroll into view
  let hasPlayed = false;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !hasPlayed) {
        hasPlayed = true;
        startAnimation();
      }
    });
  }, { threshold: 0.3 });
  observer.observe(document.querySelector('.wrap'));

  setTimeout(() => { if (!hasPlayed) { hasPlayed = true; startAnimation(); } }, 300);

  // ── Mouse-following tooltip
  const tooltip = document.getElementById('tooltip');
  const panels = document.querySelectorAll('.panel');

  panels.forEach(panel => {
    panel.addEventListener('mousemove', (e) => {
      const tip = panel.dataset.tip;
      if (!tip) return;
      tooltip.textContent = tip;
      tooltip.style.opacity = '1';
      let tx = e.clientX + 14;
      let ty = e.clientY + 14;
      const tw = 230 + 24;
      if (tx + tw > window.innerWidth) tx = e.clientX - tw;
      if (ty + 80 > window.innerHeight) ty = e.clientY - 80;
      tooltip.style.left = tx + 'px';
      tooltip.style.top = ty + 'px';
    });
    panel.addEventListener('mouseleave', () => {
      tooltip.style.opacity = '0';
    });
  });
})();
</script>
</body>
</html>
